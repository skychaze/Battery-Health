name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a draft GitHub release. Leave off for a dry run that only uploads the bundles as workflow artifacts.
        type: boolean
        default: false
      tag:
        description: Tag to publish under (e.g. v1.0.0). Required only when publish is on.
        type: string
        default: ""

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04

    runs-on: ${{ matrix.platform }}

    steps:
      - if: env.PUBLISH == 'true' && github.event_name == 'workflow_dispatch' && inputs.tag == ''
        shell: bash
        run: |
          echo "::error::publish is on but no tag was given"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # latest.json takes its version from the tag, so a tag ahead of the app version would offer an
      # update that installs the same build again.
      - if: env.PUBLISH == 'true' && startsWith(matrix.platform, 'ubuntu')
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the app version $version"
            exit 1
          fi

      - uses: ./.github/actions/setup-frontend

      - run: vp run package

      # The updater installs only bundles signed with the release key. Without it the bundles still
      # build, but publishing fails for want of signatures.
      - shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set, so the bundles are unsigned"
            exit 0
          fi
          shopt -s nullglob
          node scripts/sign-update.ts release/battery-health/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/battery-health/*.deb
            release/battery-health/*.sig

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # latest.json names the signed Linux deb that installed apps download.
        run: |
          shopt -s nullglob
          platforms='{}'
          for bundle in bundles/*.deb; do
            name=$(basename "$bundle")
            [ -f "$bundle.sig" ] || { echo "::error::$name is not signed"; exit 1; }
            key=linux-x86_64-deb
            platforms=$(jq --arg key "$key" --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
              --rawfile signature "$bundle.sig" '.[$key] = {url: $url, signature: ($signature | rtrimstr("\n"))}' <<<"$platforms")
          done
          node scripts/release-policy.ts "$TAG" "$GH_REPO" bundles/update-policy.json
          jq -n --arg version "${TAG#v}" --argjson platforms "$platforms" --slurpfile policy bundles/update-policy.json \
            '{version: $version, platforms: $platforms} + $policy[0]' > bundles/latest.json
          rm bundles/update-policy.json

          mapfile -t assets < <(find bundles -type f -print)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft --title "Battery Health $TAG" --verify-tag --generate-notes
          fi
